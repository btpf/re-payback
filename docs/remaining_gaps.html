  "Fixed in this pass: `docs/re/open_questions.md` §2.10 slopes and level 11 Q6 marked resolved, summary table recounted (201 / 173 / 28).",
  "Fixed in this pass: `docs/re/rendering.md` “Still missing: the rotating view” and “Not done: debris”; `docs/re/missions_random.md` “No HUD arrows”; `docs/re/combat_police.md` “does not draw the [crate] fragments yet”. Not stale: `rendering.md` §11 lists “unoccluded flares” for hardware mode, which is CONFIRMED (Warp3D flares are never occlusion-tested).",
  "Fixed in this pass: “TBD” comments in `payback-formats/src/texture.rs` and `map.rs` (settled in `formats.md`); `main.rs` usage (data search order, missing flags); `camera.rs` calling original aspect the default; `docs/re/frontend_menus.md` §6 describing gamepad layout 2; `docs/web.md` without the cache-busting; `docs/formats.md` palette without the Mac programs; scratch-file citations in `mission/api.rs` and `script_api.md`.",
  "Open: `CLAUDE.md` lists the replay suite as “story, rampage, multiplayer, cheats”; the suite also has `story2` (`tools/checks/replay_check.py`). Left for the maintainer (agent instructions).",
  "Kept as history: the Mac reviews (`docs/re/mac/`) and `docs/re/reviews/` name local working files (`analysis/mac/scratch_*`, `analysis/scratch/`) that are not kept; `docs/CONVENTIONS.md` “Paths in the notes” explains this."
];

const ORDER = [
  "Two small rule fixes, one batch, then re-record the replay baselines: the burning-car blast height (CB-8, `sim/contact.rs:600` to `z + 500`) and the bullet/pellet owner-side test (CB-7).",
  "Get the pending decisions from the user: CB-4 blast crime switch, MS-3 Random missions row, PL-6 pause on unfocus. Each is S once decided.",
  "A human verification pass with a fresh build: level 11 M9 with the RC car and the Q6 clock (RE-5), smooth motion and frame limit on a 144 Hz monitor, a real gamepad (axes, hot-plug, two pads), the web build in Chrome and Firefox with a GPU, and screenshots of the zoom-in map, replay clock and hardware dither.",
  "Tests: system-level tests for punch, ram score, blast side and the RC car (DT-1); run the replay suite in CI or a pre-commit script (DT-2); teach the bot the RC car and walking routes so it teleports less (DT-4).",
  "Rendering leftovers: per-blend palette snap or HUD panels in palette space (RD-1), effect sprites hiding flares (FX-1), painter's sort for tumbling models and the rotating view (RD-6), affine tops in the rotating view (RD-7), the genlocked first frame of the zoom (HU-3), hardware fades (HW-3), shadow draw order and dipping scenery (OB-1, OB-3).",
  "The per-object AI interleave (AI-1): largest refactor, changes every baseline; only worth it if frame-exact parity with original recordings becomes a goal.",
  "Low priority: layout key names before the first press (PL-8), menu model checks (FE-2, FE-3), the live-switch hitch (PF-1), snow marks (FX-3), the CD rip (RE-6), web limitations (PL-10), and a map editor (UM-1: about 1 week minimal, 2-3 weeks faithful).",
  "Throughout: keep the notes current (section 5); PL-11 only if a pad misbehaves on Linux or macOS."
];

const SOURCES = [
  "Previous report: `remaining_gaps.html` at `bbe27cb` (80 entries, 27 open, partial or new); the report before that at `8c7f7d9` (73 gaps).",
  "Checked: `git log bbe27cb..3382e77` (12 commits) with their messages and diffs; each of the 27 open entries looked up in `crates/payback/src` at `3382e77` (`sim/contact.rs` `at.z -= 500`, `sim/combat.rs` `by_player` and `BLAST_CRIME_AT_ZERO_DAMAGE`, `frontend/rampage.rs` Random missions row, `sim/mod.rs` “What remains different”, and the rest unchanged since `bbe27cb`); the committed docs swept for stale statements.",
  "New gaps: a sweep of the post-`bbe27cb` diff for “approximation”, “INFERRED”, “not reproduced”, “not done”, “TODO” and “port addition”; only PL-11 qualified (the other additions are listed as departures).",
  "Nothing was built or run in this pass."
];
</script>
<script>
(function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const SEV = { high: "High", medium: "Medium", low: "Low" };
  const EFF = { S: "S (hours)", M: "M (a day or two)", L: "L (several days)" };
  const ST = { closed: "Closed since last report", partial: "Partial", open: "Still open", new: "New" };
  const state = { q: "", sev: new Set(), area: new Set(), conf: new Set(), st: new Set() };

  const byArea = {};
  for (const g of GAPS) (byArea[g.area] ||= []).push(g);
  const count = f => GAPS.filter(f).length;
  const remaining = g => g.st !== "closed";
  const prev = GAPS.filter(g => g.was !== undefined && g.was !== "closed");
  const nSt = s => s === "new" ? count(g => g.st === "new") : prev.filter(g => g.st === s).length;

  let h = `
    <h1>${esc(META.title)}</h1>
    <p class="sub">${fmt(META.subtitle)}</p>
    <p class="meta">${fmt(META.generated)}</p>

    <h2 id="changes">Changes since the last report</h2>
    <div class="stats">
      <div class="stat"><div class="v">${prev.length}</div><div class="l">open in the last report</div></div>
      <div class="stat closed"><div class="v">${nSt("closed")}</div><div class="l">closed</div></div>
      <div class="stat partial"><div class="v">${nSt("partial")}</div><div class="l">partial</div></div>
      <div class="stat open"><div class="v">${nSt("open")}</div><div class="l">still open</div></div>
      <div class="stat new"><div class="v">${nSt("new")}</div><div class="l">new gaps found</div></div>
    </div>
    <div class="panel">
      <p>${fmt(CHANGES.intro)} ${nSt("closed")} of the ${prev.length} open then are closed; ${nSt("partial")} are partly done and ${nSt("open")} not started (${count(g => g.was === "closed")} were closed earlier and stay listed). ${nSt("new")} new gaps were found in the new code and docs.</p>
      <b>Still open or partial</b>
      <table class="chg"><thead><tr><th>ID</th><th>Status</th><th>What remains</th></tr></thead><tbody>
      ${CHANGES.stillOpen.map(([id, s, t]) => `<tr><td><a href="#gap-${id}">${id}</a></td><td><span class="tag st-${s}">${s}</span></td><td>${fmt(t)}</td></tr>`).join("")}
      </tbody></table>
      <p style="margin-top:10px"><b>New:</b> ${GAPS.filter(g => g.st === "new").map(g => `<a href="#gap-${g.id}">${g.id}</a> ${fmt(g.title)}`).join("; ")}.</p>
      <p><b>Closed in this pass:</b> ${GAPS.filter(g => g.st === "closed" && g.was !== "closed").map(g => `<a href="#gap-${g.id}">${g.id}</a>`).join(", ") || "none"}.</p>
    </div>

    <h2 id="summary">1. Summary</h2>
    <div class="stats">
      <div class="stat"><div class="v">${count(remaining)}</div><div class="l">gaps remaining (open + partial + new)</div></div>
      <div class="stat high"><div class="v">${count(g => remaining(g) && g.sev === "high")}</div><div class="l">high severity</div></div>
      <div class="stat medium"><div class="v">${count(g => remaining(g) && g.sev === "medium")}</div><div class="l">medium severity</div></div>
      <div class="stat low"><div class="v">${count(g => remaining(g) && g.sev === "low")}</div><div class="l">low severity</div></div>
      <div class="stat"><div class="v">${PENDING.length}</div><div class="l">decisions pending</div></div>
      <div class="stat"><div class="v">${DEPARTURES.length}</div><div class="l">deliberate departures</div></div>
      <div class="stat"><div class="v">${UNVERIFIED.length}</div><div class="l">implemented, unverified</div></div>
    </div>
    <div class="panel">
      ${META.summary.map(p => `<p>${fmt(p)}</p>`).join("")}
      <b>Headline gaps</b>
      <ol class="plain">${HEADLINES.map(x => `<li>${fmt(x)}</li>`).join("")}</ol>
    </div>

    <h3>Counts by area (remaining)</h3>
    <div class="panel"><table>
      <thead><tr><th>Area</th><th class="num">High</th><th class="num">Medium</th><th class="num">Low</th><th class="num">Remaining</th><th class="num">Closed</th></tr></thead>
      <tbody>${AREAS.filter(a => byArea[a.id]).map(a => {
        const l = byArea[a.id], r = l.filter(remaining);
        const c = s => r.filter(g => g.sev === s).length || "";
        return `<tr><td><a href="#area-${a.id}">${esc(a.name)}</a></td><td class="num">${c("high")}</td><td class="num">${c("medium")}</td><td class="num">${c("low")}</td><td class="num">${r.length}</td><td class="num">${l.length - r.length || ""}</td></tr>`;
      }).join("")}</tbody>
    </table></div>

    <h3>Decisions pending (user)</h3>
    <div class="panel"><ul class="plain">${PENDING.map(x => `<li>${fmt(x)}</li>`).join("")}</ul></div>

    <h3>How to read this page</h3>
    <div class="panel note">${META.legend.map(p => `<p>${fmt(p)}</p>`).join("")}</div>

    <h2 id="gaps">2. Gaps by area</h2>
    <div class="controls">
      <input type="search" id="q" placeholder="Search gaps (text, file, address, e.g. 10146280 or contact.rs)" aria-label="Search gaps">
      <div class="chips" id="stchips"><span class="lab">Status</span></div>
      <div class="chips" id="sevchips"><span class="lab">Severity</span></div>
      <div class="chips" id="confchips"><span class="lab">Confidence</span></div>
      <div class="chips" id="areachips"><span class="lab">Area</span></div>
      <div class="chips"><button class="chip" id="reset">Clear filters</button><span class="count" id="shown"></span></div>
    </div>
    <div id="gaplist">`;

  const stOrder = { new: 0, open: 1, partial: 2, closed: 3 };
  const sevOrder = { high: 0, medium: 1, low: 2 };
  for (const a of AREAS) {
    const l = byArea[a.id];
    if (!l) {
      if (a.note) h += `<section class="area" data-area="${a.id}"><h3 id="area-${a.id}">${esc(a.name)} <span class="n">0</span></h3><p class="note">${fmt(a.note)}</p><p class="empty">No gaps in this area.</p></section>`;
      continue;
    }
    h += `<section class="area" data-area="${a.id}"><h3 id="area-${a.id}">${esc(a.name)} <span class="n">${l.filter(remaining).length}</span></h3>`;
    if (a.note) h += `<p class="note">${fmt(a.note)}</p>`;
    for (const g of l.slice().sort((x, y) => stOrder[x.st] - stOrder[y.st] || sevOrder[x.sev] - sevOrder[y.sev])) {
      const text = [g.id, g.title, g.orig, g.port, g.impact, g.ev, g.since, a.name, g.st].join(" ").toLowerCase();
      h += `<article class="gap ${g.sev} st-${g.st}" id="gap-${g.id}" data-sev="${g.sev}" data-area="${g.area}" data-conf="${g.conf}" data-st="${g.st}" data-text="${esc(text)}">
        <div class="t"><span class="id">${esc(g.id)}</span>${fmt(g.title)}</div>
        <div class="tags">
          <span class="tag st-${g.st}">${ST[g.st]}</span>
          <span class="tag sev-${g.sev}">${SEV[g.sev]} severity</span>
          <span class="tag">Effort ${EFF[g.effort]}</span>
          <span class="tag">${g.conf === "confirmed" ? "Confirmed in code" : g.conf === "suspected" ? "Suspected" : "Open RE question"}</span>
          ${g.visible ? `<span class="tag">${esc(g.visible)}</span>` : ""}
        </div>
        <dl>
          <dt>Status since last report</dt><dd>${fmt(g.since)}</dd>
          <dt>Original</dt><dd>${fmt(g.orig)}</dd>
          <dt>Port now</dt><dd>${fmt(g.port)}</dd>
          <dt>Player impact</dt><dd>${fmt(g.impact)}</dd>
          <dt>Evidence</dt><dd>${fmt(g.ev)}</dd>
        </dl>
      </article>`;
    }
    h += `<p class="empty hidden">No gaps in this area match the filters.</p></section>`;
  }
  h += `</div>

    <h2 id="departures">3. Deliberate departures (not gaps)</h2>
    <p class="note">Decisions by the user or documented in <code>docs/re/mac_version.md</code> "Decisions", and port additions. Don't "fix" these.</p>
    <div class="panel"><table><thead><tr><th>Departure</th><th>Why / where</th></tr></thead><tbody>
      ${DEPARTURES.map(d => `<tr><td>${fmt(d[0])}</td><td>${fmt(d[1])}</td></tr>`).join("")}
    </tbody></table></div>
    <h3>Faithful to the original (look like bugs, are not)</h3>
    <div class="panel"><ul class="plain">${FAITHFUL.map(x => `<li>${fmt(x)}</li>`).join("")}</ul></div>

    <h2 id="unverified">4. Implemented but unverified</h2>
    <p class="note">Present in the port, never checked against the original or by a person, or checked only by the port's own tests and bots.</p>
    <div class="panel"><table><thead><tr><th>Item</th><th>What is missing to verify it</th></tr></thead><tbody>
      ${UNVERIFIED.map(d => `<tr><td>${fmt(d[0])}</td><td>${fmt(d[1])}</td></tr>`).join("")}
    </tbody></table></div>

    <h2 id="stale">5. Stale notes</h2>
    <p class="note">Notes that still describe fixed things as missing (or the reverse).</p>
    <div class="panel"><ul class="plain">${STALE.map(x => `<li>${fmt(x)}</li>`).join("")}</ul></div>

    <h2 id="order">6. Suggested order of work</h2>
    <div class="panel"><ol class="plain">${ORDER.map(x => `<li>${fmt(x)}</li>`).join("")}</ol></div>

    <h2 id="sources">7. Sources and method</h2>
    <div class="panel note">${SOURCES.map(p => `<p>${fmt(p)}</p>`).join("")}</div>`;

  document.getElementById("app").innerHTML = h;

  const toc = [
    ["changes", "Changes since last report", ""], ["summary", "1. Summary", ""], ["gaps", "2. Gaps by area", count(remaining)],
    ...AREAS.filter(a => byArea[a.id] || a.note).map(a => ["area-" + a.id, a.name, (byArea[a.id] || []).filter(remaining).length, true]),
    ["departures", "3. Deliberate departures", DEPARTURES.length], ["unverified", "4. Unverified", UNVERIFIED.length],
    ["stale", "5. Stale notes", STALE.length], ["order", "6. Order of work", ""], ["sources", "7. Sources", ""]];
  document.getElementById("toc").innerHTML = `<b>Contents</b>` + toc.map(([id, t, n, sub]) =>
    `<a href="#${id}" class="${sub ? "sub" : ""}" data-toc="${id}"><span>${esc(t)}</span><span class="n">${n}</span></a>`).join("");

  const mk = (box, set, items) => {
    const el = document.getElementById(box);
    for (const [v, label, dot] of items) {
      const b = document.createElement("button");
      b.className = "chip"; b.setAttribute("aria-pressed", "false"); b.dataset.v = v;
      b.innerHTML = (dot ? `<span class="dot ${v}"></span>` : "") + esc(label);
      b.onclick = () => { set.has(v) ? set.delete(v) : set.add(v); b.setAttribute("aria-pressed", set.has(v)); apply(); };
      el.appendChild(b);
    }
  };
  mk("stchips", state.st, [["new", "New"], ["open", "Open"], ["partial", "Partial"], ["closed", "Closed"]]);
  mk("sevchips", state.sev, [["high", "High", 1], ["medium", "Medium", 1], ["low", "Low", 1]]);
  mk("confchips", state.conf, [["confirmed", "Confirmed"], ["suspected", "Suspected"], ["open", "Open RE question"]]);
  mk("areachips", state.area, AREAS.filter(a => byArea[a.id]).map(a => [a.id, a.short || a.name]));
  const q = document.getElementById("q");
  q.oninput = () => { state.q = q.value.trim().toLowerCase(); apply(); };
  document.getElementById("reset").onclick = () => {
    state.q = ""; q.value = ""; state.sev.clear(); state.area.clear(); state.conf.clear(); state.st.clear();
    document.querySelectorAll(".chip[aria-pressed]").forEach(b => b.setAttribute("aria-pressed", "false")); apply();
  };
  function apply() {
    let shown = 0;
    const words = state.q.split(/\s+/).filter(Boolean);
    document.querySelectorAll("article.gap").forEach(el => {
      const ok = (!state.sev.size || state.sev.has(el.dataset.sev)) &&
                 (!state.area.size || state.area.has(el.dataset.area)) &&
                 (!state.conf.size || state.conf.has(el.dataset.conf)) &&
                 (!state.st.size || state.st.has(el.dataset.st)) &&
                 words.every(w => el.dataset.text.includes(w));
      el.classList.toggle("hidden", !ok); if (ok) shown++;
    });
    document.querySelectorAll("section.area").forEach(s => {
      const any = s.querySelector("article.gap:not(.hidden)");
      const filtered = state.area.size && !state.area.has(s.dataset.area);
      s.classList.toggle("hidden", !!filtered);
      const e = s.querySelector(".empty");
      if (s.querySelector("article.gap")) e.classList.toggle("hidden", !!any || !!filtered);
      const t = document.querySelector(`[data-toc="area-${s.dataset.area}"] .n`);
      if (t) t.textContent = s.querySelectorAll("article.gap:not(.hidden)").length;
    });
    document.getElementById("shown").textContent = `${shown} of ${GAPS.length} entries shown`;
  }
  apply();
})();
</script>
</body>
</html>
