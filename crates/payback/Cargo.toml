[package]
name = "payback"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
payback-formats = { path = "../payback-formats" }
payback-mpeg = { path = "../payback-mpeg" }
# wav: the sound effects; mp3/flac/vorbis too for user-ripped CD music (`music.rs`).
bevy = { version = "0.19.1", features = ["wav", "mp3", "flac", "vorbis"] }
# Bevy's decoder, to reject music files it cannot decode instead of panicking.
rodio = { version = "0.22", default-features = false }
# Same winit as Bevy, for the window icon.
winit = { version = "0.30", default-features = false }

# Native only: the folder picker and message box when the game data is not
# found (`locate.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"

# The web build (docs/web.md): JS glue, the page's URL and localStorage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Document", "HtmlElement"] }

[build-dependencies]
payback-formats = { path = "../payback-formats" }
ico = "0.5"
embed-resource = "3"
