[package]
name = "payback-extract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Extracts the original Payback game files next to payback.exe"

[dependencies]
payback-formats = { path = "../payback-formats" }
delharc = { version = "0.6", default-features = false, features = ["std"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
unrar = "0.5"
flacenc = { version = "0.4", default-features = false, features = ["par"] }
