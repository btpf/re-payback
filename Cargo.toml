[workspace]
resolver = "3"
members = ["crates/payback-formats", "crates/payback-mpeg", "crates/payback", "crates/payback-extract"]

[workspace.package]
edition = "2024"
license = "MIT"

# Bevy is slow in debug builds; optimise dependencies but keep our code debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The web build (tools/web/build_web.sh, docs/web.md): a smaller download.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "thin"
strip = true
